services:
  realworld-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - realworld_network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realworld}
      POSTGRES_USER: ${POSTGRES_USER:-realworld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realworld}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  realworld-adminer:
    image: adminer:latest
    restart: unless-stopped
    networks:
      - realworld_network
    ports:
      - "8081:8080"
    depends_on:
      realworld-postgres:
        condition: service_healthy

  realworld-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - realworld_network
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:

networks:
  realworld_network:
    driver: bridge
